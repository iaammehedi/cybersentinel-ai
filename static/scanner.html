<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Scanner | CyberSentinel AI</title>

<style>
:root {
  color-scheme: dark;
  --bg:#000;
  --panel:#101010;
  --line:#292929;
  --accent:#40E0C0;
  --text:#F5F7FA;
  --muted:#9CA3AF;
}

* { box-sizing:border-box; }

body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font:15px/1.6 system-ui,sans-serif;
}

button,input { font:inherit; }
button,a { -webkit-tap-highlight-color:transparent; }
button { cursor:pointer; }
a { color:inherit; text-decoration:none; }

.layout { min-height:100vh; }

/* Sidebar */
.sidebar {
  background:var(--panel);
  border-color:var(--line);
  padding:18px 14px;
  display:flex;
  flex-direction:column;
  gap:20px;
  z-index:30;
}

.brand {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:18px;
  font-weight:800;
  padding:5px 8px;
  white-space:nowrap;
}

.brand span { color:var(--text); }

.brand-icon {
  width:25px;
  height:25px;
  flex-shrink:0;
}

.nav {
  display:grid;
  gap:6px;
}

.nav a {
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px;
  border:1px solid transparent;
  border-radius:10px;
  color:var(--muted);
  transition:background .15s ease,color .15s ease;
}

.nav a:hover,
.nav a.active {
  color:var(--text);
  background:var(--bg);
  border-color:var(--line);
}

.nav a.active {
  box-shadow:inset 3px 0 var(--text);
}

.nav-icon {
  width:21px;
  height:21px;
  flex-shrink:0;
  stroke:currentColor;
}

/* Main content */
main {
  width:min(780px,100%);
  margin:auto;
  padding:22px 16px;
}

.topbar {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:20px;
}

.top-left {
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.top-heading {
  min-width:0;
}

h1 {
  font-size:26px;
  line-height:1.3;
  margin:0;
}

h2 {
  font-size:18px;
  margin:0 0 8px;
}

p,.muted { color:var(--muted); }

.panel {
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:17px;
  padding:19px;
  margin-bottom:16px;
}

.small { font-size:12px; }

.menu-button {
  display:none;
  width:45px;
  height:45px;
  flex-shrink:0;
  align-items:center;
  justify-content:center;
  padding:0;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:12px;
}

.menu-button svg {
  width:23px;
  height:23px;
  stroke:currentColor;
}

.language-button {
  flex-shrink:0;
  padding:9px 13px;
  background:var(--panel);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:10px;
  font-weight:650;
}

input[type="text"],
input[type="url"],
input[type="password"] {
  width:100%;
  padding:12px;
  border:1px solid var(--line);
  border-radius:10px;
  background:var(--bg);
  color:var(--text);
  outline:none;
}

input:focus {
  border-color:var(--text);
}

label {
  display:block;
  margin:13px 0 6px;
}

.check {
  display:flex;
  align-items:flex-start;
  gap:10px;
}

.check input {
  width:17px;
  height:17px;
  flex-shrink:0;
  margin-top:5px;
  accent-color:var(--text);
}

button.primary {
  border:1px solid var(--text);
  border-radius:10px;
  padding:11px 15px;
  background:var(--text);
  color:var(--bg);
  font-weight:750;
}

button:disabled {
  opacity:.5;
  cursor:not-allowed;
}

.actions {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

#status {
  color:var(--text);
  overflow-wrap:anywhere;
}

pre {
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
  color:var(--text);
}

.overlay {
  display:none;
}

/* Desktop layouts */
@media (min-width:760px) {
  .layout.vertical {
    display:grid;
    grid-template-columns:235px minmax(0,1fr);
  }

  .layout.vertical .sidebar {
    border-right:1px solid var(--line);
    min-height:100vh;
  }

  .layout.vertical main {
    width:100%;
    max-width:820px;
  }

  .layout.horizontal .sidebar {
    flex-direction:row;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid var(--line);
  }

  .layout.horizontal .nav {
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
  }

  .layout.horizontal .nav a {
    padding:10px;
  }
}

/* Mobile: hidden off-canvas menu */
@media (max-width:759px) {
  .sidebar {
    position:fixed;
    inset:0 auto 0 0;
    width:min(290px,85vw);
    height:100dvh;
    overflow-y:auto;
    padding:22px 15px;
    border-right:1px solid var(--line);
    transform:translateX(-105%);
    visibility:hidden;
    transition:
      transform .22s ease,
      visibility .22s ease;
    box-shadow:none;
  }

  body.menu-open .sidebar {
    transform:translateX(0);
    visibility:visible;
    box-shadow:15px 0 45px #0008;
  }

  .nav {
    display:grid;
    gap:7px;
  }

  .nav a {
    padding:13px;
  }

  .menu-button {
    display:inline-flex;
  }

  .overlay {
    position:fixed;
    inset:0;
    z-index:25;
    background:rgba(0,0,0,.68);
  }

  body.menu-open .overlay {
    display:block;
  }

  body.menu-open {
    overflow:hidden;
  }

  main {
    width:100%;
    padding:18px 14px 28px;
  }

  h1 { font-size:23px; }

  .panel {
    padding:17px;
    border-radius:16px;
  }
}

@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    transition:none !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>

    </nav>

    <p class="small muted" id="sideNote">
      শুধু অনুমোদিত ওয়েবসাইট পরীক্ষা করো।
    </p>
  </aside>

  <div class="overlay" id="overlay" aria-hidden="true"></div>

  <main>
    <header class="topbar">
      <div class="top-left">
        <button class="menu-button" id="menuButton"
                type="button" aria-label="Open menu"
