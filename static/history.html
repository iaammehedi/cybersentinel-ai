<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>History | CyberSentinel AI</title>
<link rel="stylesheet" href="/static/shared.css">
<script src="/static/shared.js"></script>
</head>
<body data-page="history">
<div class="layout vertical" id="layout">
  <main>
    <header class="topbar">
      <div class="top-left">
        <div>
          <h1 data-i="title">পরীক্ষার ইতিহাস</h1>
          <div class="muted small" data-i="subtitle">এই ব্রাউজারে সংরক্ষিত</div>
        </div>
      </div>
    </header>

    <section class="panel">
      <p data-i="desc">এই ব্রাউজারে সংরক্ষিত রিপোর্টগুলো এখানে দেখা যাবে। এগুলো সার্ভারে সংরক্ষিত নয়; ব্রাউজারের ডাটা মুছলে ইতিহাসও মুছে যাবে।</p>
      <div class="actions">
        <button class="primary" id="export" type="button" data-i="exportBtn">ইতিহাস Export</button>
        <button id="clear" type="button" data-i="clearBtn">ইতিহাস মুছুন</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <section id="entries"></section>
  </main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);
const HKEY = "cybersentinel.history";

const DICT = {
  bn: {
    title:"পরীক্ষার ইতিহাস", subtitle:"এই ব্রাউজারে সংরক্ষিত",
    desc:"এই ব্রাউজারে সংরক্ষিত রিপোর্টগুলো এখানে দেখা যাবে। এগুলো সার্ভারে সংরক্ষিত নয়; ব্রাউজারের ডাটা মুছলে ইতিহাসও মুছে যাবে।",
    exportBtn:"ইতিহাস Export", clearBtn:"ইতিহাস মুছুন",
    empty:"এখনো কোনো রিপোর্টের ইতিহাস নেই।",
    deleted:"ইতিহাস মুছে ফেলা হয়েছে।",
    confirm:"তুমি কি সব ইতিহাস মুছে ফেলতে চাও?",
    openReport:"Reports-এ দেখো", showJson:"JSON দেখাও", hideJson:"JSON লুকাও", remove:"মুছুন",
    nothingToExport:"Export করার মতো ইতিহাস নেই।",
    storageError:"পরিবর্তন সংরক্ষণ করা যায়নি।"
  },
  en: {
    title:"Scan history", subtitle:"Saved in this browser",
    desc:"Reports saved in this browser appear here. They are not stored on the server; clearing browser data also clears this history.",
    exportBtn:"Export history", clearBtn:"Clear history",
    empty:"No report history yet.",
    deleted:"History cleared.",
    confirm:"Delete all history?",
    openReport:"View in Reports", showJson:"Show JSON", hideJson:"Hide JSON", remove:"Delete",
    nothingToExport:"There is no history to export.",
    storageError:"Could not save the change."
  }
};

const T = k => CS.t(k);

function getHistory() {
  try {
    const data = JSON.parse(localStorage.getItem(HKEY) || "[]");
    return Array.isArray(data) ? data : [];
  } catch (_) { return []; }
}

function saveHistory(data) {
  try { localStorage.setItem(HKEY, JSON.stringify(data)); return true; }
  catch (_) { $("status").textContent = T("storageError"); return false; }
}

function formatDate(value) {
  if (typeof value !== "string" || !value) return "";
  const d = new Date(value);
  return isNaN(d) ? value : d.toLocaleString();
}

function render() {
  const box = $("entries");
  box.replaceChildren();
  const data = getHistory();

  if (!data.length) {
    const p = document.createElement("p");
    p.textContent = T("empty");
    box.append(p);
    return;
  }

  data.forEach((raw, index) => {
    const item = raw && typeof raw === "object" ? raw : {};
    const card = document.createElement("article");
    card.className = "item";

    const h = document.createElement("h2");
    h.textContent = typeof item.title === "string" && item.title ? item.title : "Report " + (index + 1);

    const date = document.createElement("p");
    date.textContent = formatDate(item.date);

    const pre = document.createElement("pre");
    pre.className = "hidden";
    pre.textContent = JSON.stringify(item.report, null, 2);

    const actions = document.createElement("div");
    actions.className = "actions";

    const open = document.createElement("button");
    open.type = "button";
    open.className = "primary";
    open.textContent = T("openReport");
    open.disabled = !(item.report && typeof item.report === "object");
    open.addEventListener("click", () => {
      try { sessionStorage.setItem("cybersentinel.openReport", JSON.stringify(item.report)); } catch (_) {}
      location.href = "/static/reports.html";
    });

    const toggle = document.createElement("button");
    toggle.type = "button";
    toggle.textContent = T("showJson");
    toggle.addEventListener("click", () => {
      const hidden = pre.classList.toggle("hidden");
      toggle.textContent = hidden ? T("showJson") : T("hideJson");
    });

    const remove = document.createElement("button");
    remove.type = "button";
    remove.textContent = T("remove");
    remove.addEventListener("click", () => {
      const next = getHistory();
      next.splice(index, 1);
      if (saveHistory(next)) $("status").textContent = "";
      render();
    });

    actions.append(open, toggle, remove);
    card.append(h, date, pre, actions);
    box.append(card);
  });
}

CS.init({ dict: DICT, onChange: render });

$("clear").addEventListener("click", () => {
  if (!confirm(T("confirm"))) return;
  try { localStorage.removeItem(HKEY); } catch (_) {}
  $("status").textContent = T("deleted");
  render();
});

$("export").addEventListener("click", () => {
  const data = getHistory();
  if (!data.length) { $("status").textContent = T("nothingToExport"); return; }
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "cybersentinel-history.json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
