<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="no-referrer">
<title>CyberSentinel AI</title>
<link rel="stylesheet" href="/static/shared.css">
<script src="/static/shared.js"></script>
<style>
/* Gemini-style minimal chat layout (this page only) */
body[data-page="chat"] main{display:flex;flex-direction:column;min-height:100dvh;max-width:760px;padding-bottom:10px}
body[data-page="chat"] .topbar{margin-bottom:4px}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:40px;height:40px;padding:0;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:1px solid transparent}
.icon-btn:hover{background:var(--panel);border-color:var(--line)}
.icon-btn .icon{width:20px;height:20px;flex:0 0 20px}

.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:30px 10px;min-height:42vh}
.empty-icon{width:38px;height:38px;margin-bottom:8px;color:var(--accent)}
.empty-state h2{font-size:26px;margin:4px 0 2px}
.empty-state p{margin:0 0 14px;max-width:360px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:480px}
.chip{border:1px solid var(--line);border-radius:999px;padding:9px 15px;background:var(--panel);color:var(--text);font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--muted)}
.chip:focus-visible{outline:2px solid var(--text);outline-offset:2px}

.chat{flex:1;display:flex;flex-direction:column;gap:16px;padding:10px 2px 16px}
.bubble-row{display:flex}
.bubble-row.user{justify-content:flex-end}
.bubble{max-width:85%;overflow-wrap:anywhere;white-space:pre-wrap;line-height:1.55}
.bubble.user{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 4px 18px;padding:11px 15px}
.bubble.assistant{padding:2px 2px;color:var(--text)}
.typing-dots{display:inline-flex;gap:4px;padding:6px 2px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:cs-blink 1.2s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes cs-blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.composer{position:sticky;bottom:0;background:var(--bg);padding:8px 0 4px}
#chatForm{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:26px;background:var(--panel);padding:8px 8px 8px 18px}
#prompt{flex:1;border:0;background:transparent;resize:none;max-height:140px;padding:8px 0;color:var(--text);font:inherit;outline:none}
.send-btn{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--text);color:var(--bg);border:0;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.send-btn .icon{stroke:currentColor;width:18px;height:18px}
.spin{animation:cs-spin .8s linear infinite}
@keyframes cs-spin{to{transform:rotate(360deg)}}
.disclaimer{text-align:center;font-size:11px;color:var(--muted);margin:8px 2px 0}
#status{min-height:18px;text-align:center}
</style>
</head>
<body data-page="chat">
<div class="layout vertical" id="layout">
  <main>
    <header class="topbar">
      <div class="top-left">
        <div class="top-heading">
          <h1 data-i="pageTitle">Chat</h1>
        </div>
      </div>
      <div class="top-actions">
        <button id="newChatButton" class="icon-btn" type="button" aria-label="New chat">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="language-button" id="languageButton" type="button"></button>
      </div>
    </header>

    <div id="emptyState" class="empty-state">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2l2.2 6.8L21 11l-6.8 2.2L12 20l-2.2-6.8L3 11l6.8-2.2L12 2z"/>
      </svg>
      <h2 data-i="greeting">কী জানতে চাও?</h2>
      <p class="muted" data-i="greetingSub">website security, header অথবা Scanner-এর ফলাফল নিয়ে প্রশ্ন করো</p>
      <div class="chips" id="chips"></div>
    </div>

    <div class="chat hidden" id="chat" aria-live="polite"></div>

    <div class="composer">
      <form id="chatForm">
        <textarea id="prompt" rows="1" data-ph="placeholder"></textarea>
        <button id="sendButton" class="send-btn" type="submit" aria-label="Send">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 19V5"/><path d="m5 12 7-7 7 7"/>
          </svg>
        </button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="disclaimer" data-i="disclaimer">এই সহকারী শুধু website security বিষয়ে সাহায্য করে এবং exploit/attack সংক্রান্ত সাহায্য দেয় না।</p>
    </div>
  </main>
</div>

<script>
"use strict";
const $ = id => document.getElementById(id);

const DICT = {
  bn: {
    pageTitle:"Chat",
    greeting:"কী জানতে চাও?",
    greetingSub:"website security, header অথবা Scanner-এর ফলাফল নিয়ে প্রশ্ন করো",
    placeholder:"একটি প্রশ্ন লেখো...",
    disclaimer:"এই সহকারী শুধু website security বিষয়ে সাহায্য করে এবং exploit/attack সংক্রান্ত সাহায্য দেয় না।",
    empty:"প্রথমে তোমার প্রশ্ন লিখো।",
    newChat:"নতুন চ্যাট",
    send:"পাঠাও",
    thinking:"ভাবছে...",
    user:"তুমি", assistant:"CyberSentinel",
    notConfigured:"AI চ্যাট এখনো চালু করা হয়নি। Render-এ GEMINI_API_KEY সেট করতে হবে।",
    busy:"এখন অনেক অনুরোধ আসছে বা তুমি দ্রুত পাঠাচ্ছ; একটু অপেক্ষা করে আবার চেষ্টা করো।",
    error:"উত্তর পাওয়া যায়নি; একটু পরে আবার চেষ্টা করো।",
    network:"ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করো।"
  },
  en: {
    pageTitle:"Chat",
    greeting:"What would you like to know?",
    greetingSub:"Ask about website security, headers, or your Scanner results",
    placeholder:"Ask a question...",
    disclaimer:"This assistant only discusses website security and will not help with exploits or attacks.",
    empty:"Please enter a question first.",
    newChat:"New chat",
    send:"Send",
    thinking:"Thinking...",
    user:"You", assistant:"CyberSentinel",
    notConfigured:"AI chat isn't enabled yet. GEMINI_API_KEY needs to be set on Render.",
    busy:"Things are busy right now, or you're sending too fast; please wait and try again.",
    error:"Could not get a reply; please try again shortly.",
    network:"Check your internet connection and try again."
  }
};

const SUGGESTIONS = {
  bn: [
    "HSTS header কী?",
    "CSP কীভাবে কাজ করে?",
    "আমার স্ক্যান ফলাফল ব্যাখ্যা করো",
    "Cookie flag কেন দরকার?"
  ],
  en: [
    "What is the HSTS header?",
    "How does CSP work?",
    "Explain my scan results",
    "Why do cookie flags matter?"
  ]
};

// Display log (rendered bubbles). Separate from `history`, which is
// what's actually sent to the backend.
let messages = [];
let history = [];
let busy = false;

const T = k => CS.t(k);
const MAX_HISTORY_TURNS = 10;

function renderChips() {
  const box = $("chips");
  box.replaceChildren();
  (SUGGESTIONS[CS.prefs().language] || SUGGESTIONS.bn).forEach(text => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = text;
    b.addEventListener("click", () => { if (!busy) sendMessage(text); });
    box.append(b);
  });
}

function bubble(who, text, typing) {
  const row = document.createElement("div");
  row.className = "bubble-row " + who;
  const b = document.createElement("div");
  b.className = "bubble " + who;
  if (typing) {
    b.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
  } else {
    b.textContent = text;
  }
  row.append(b);
  return row;
}

function renderChat() {
  const hasMessages = messages.length > 0;
  $("emptyState").classList.toggle("hidden", hasMessages);
  $("chat").classList.toggle("hidden", !hasMessages);

  const box = $("chat");
  box.replaceChildren();
  messages.forEach(m => box.append(bubble(m.who, m.text, m.typing)));
  box.scrollTop = box.scrollHeight;
}

CS.init({ dict: DICT, onChange: () => { renderChips(); renderChat(); } });

function autoResize() {
  const el = $("prompt");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 140) + "px";
}
$("prompt").addEventListener("input", autoResize);

function setBusy(next) {
  busy = next;
  const btn = $("sendButton");
  btn.disabled = busy;
  btn.innerHTML = busy
    ? '<svg class="icon spin" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9"/></svg>'
    : '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>';
}

async function sendMessage(text) {
  messages.push({ who: "user", text });
  renderChat();

  history.push({ role: "user", text });
  if (history.length > MAX_HISTORY_TURNS) history = history.slice(-MAX_HISTORY_TURNS);

  const typingMsg = { who: "assistant", text: "", typing: true };
  messages.push(typingMsg);
  renderChat();

  setBusy(true);
  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });

    const data = await response.json().catch(() => null);
    messages.pop(); // remove typing indicator

    if (!response.ok) {
      const code = response.status;
      const detail = data && typeof data.detail === "string" ? data.detail : "";
      const key = code === 503 ? "notConfigured" : code === 429 ? "busy" : "error";
      messages.push({ who: "assistant", text: detail || T(key) });
      history.pop();
      renderChat();
      return;
    }

    const reply = data && typeof data.reply === "string" ? data.reply : "";
    if (!reply) throw new Error("empty");

    history.push({ role: "model", text: reply });
    messages.push({ who: "assistant", text: reply });
    renderChat();
  } catch (_) {
    messages.pop();
    messages.push({ who: "assistant", text: T("network") });
    history.pop();
    renderChat();
  } finally {
    setBusy(false);
  }
}

$("chatForm").addEventListener("submit", e => {
  e.preventDefault();
  if (busy) return;
  const text = $("prompt").value.trim();
  if (!text) {
    $("status").textContent = T("empty");
    $("prompt").focus();
    return;
  }
  $("prompt").value = "";
  autoResize();
  $("status").textContent = "";
  sendMessage(text);
});

$("prompt").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    $("chatForm").requestSubmit();
  }
});

$("newChatButton").addEventListener("click", () => {
  if (busy) return;
  messages = [];
  history = [];
  $("status").textContent = "";
  renderChat();
  $("prompt").focus();
});
</script>
</body>
</html>
